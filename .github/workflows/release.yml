name: release

# Push a tag like v1.0.0 to build, sign, notarize (when secrets exist), and draft a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Info.plist
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [ "v$plist_version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match Info.plist $plist_version"; exit 1; }

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE_P12_BASE64" ]; then
            echo "No Developer ID secrets; the release will be ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "DOTSHOT_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          [ -n "$NOTARY_KEY_P8" ] || { echo "No notarization secrets."; exit 0; }
          printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "DOTSHOT_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "DOTSHOT_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "DOTSHOT_NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build release
        run: ./scripts/release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotshot-release
          path: |
            build/release/*/dotshot-*.dmg
            build/release/*/dotshot-*.zip
            build/release/*/SHA256SUMS.txt
            build/release/*/dotshot.rb

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="build/release/$version"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$notes"
          printf '\n---\n\n**Build:** %s\n\n```\n%s\n```\n' "$(cat "$dir/SIGNING.txt")" "$(cat "$dir/SHA256SUMS.txt")" >> "$notes"
          gh release create "$GITHUB_REF_NAME" --draft --title "dotshot $version" --notes-file "$notes" \
            "$dir/dotshot-$version.dmg" "$dir/dotshot-$version.zip" "$dir/SHA256SUMS.txt"
