name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Tests
        run: ./scripts/test.sh
      - name: Build universal ad-hoc app
        run: ./scripts/build.sh --app "$PWD/dist/dotshot.app" --no-launch --adhoc --universal
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict "$PWD/dist/dotshot.app"
          for binary in dist/dotshot.app/Contents/MacOS/dotshot dist/dotshot.app/Contents/Resources/{panel,ocr-slug,avresize}; do
            lipo "$binary" -verify_arch arm64 x86_64
          done
