name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck app
        run: swiftc -typecheck Sources/ShotPill.swift
      - name: Check capture script
        run: bash -n scripts/shot-to-work.sh
      - name: Build ad-hoc signed app
        run: ./scripts/build.sh --app "$PWD/dist/Shot Pill.app" --no-launch --adhoc
      - name: Verify signature
        run: codesign --verify --deep --strict "$PWD/dist/Shot Pill.app"
